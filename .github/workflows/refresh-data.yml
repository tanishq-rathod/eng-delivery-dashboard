# Step 5b: refresh the data every Monday so the deployed dashboard stays current.
name: Refresh delivery data
on:
  schedule:
    - cron: "30 3 * * 1"     # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python collect.py && python report.py
      - name: Commit new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
